services:
  - type: web
    name: studyforge
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true       # Render auto-generates a secure random value
      - key: GROQ_API_KEY
        sync: false               # you fill this in the Render dashboard (optional)
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
